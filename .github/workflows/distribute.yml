name: Distribute

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  FASTLANE_SKIP_UPDATE_CHECK: true
  FASTLANE_XCODE_LIST_TIMEOUT: 60
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 180
  HOMEBREW_NO_INSTALL_CLEANUP: TRUE
  BUNDLE_PATH: vendor/bundle

jobs:
  build:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        kind: [mac, ios]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: .ruby-version
      - name: Install Gems
        run: bundle install --jobs 4 --retry 3

      # The image carries exactly one Xcode 27 and symlinks Xcode.app, Xcode_27.0.app and
      # Xcode_27.0.0.app at it, so DEVELOPER_DIR above names a path, not a version: it read as a
      # release for the whole week it pointed at Xcode 27 beta 6, including while App Store Connect
      # was rejecting what that beta built. The build number is the only thing that tells a beta
      # from the release apart (27A5252f against the 27A266a release candidate), so print it, along
      # with the bundle the symlink actually resolves to, before anything is built with it.
      - name: Report the selected Xcode
        run: |
          set -euo pipefail

          # The aliases are the image's to name, and the update that replaces the beta is free to
          # spell them differently. Say so here rather than letting xcrun fail halfway through a
          # half-hour build with nothing but a path that no longer exists.
          if [ ! -d "$DEVELOPER_DIR" ]; then
            reason="$DEVELOPER_DIR is gone: the image no longer spells that alias the way this expects."
            echo "::error title=DEVELOPER_DIR does not exist::$reason Repoint it at an Xcode listed below."
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "  no Xcode installed"
            exit 1
          fi

          echo "DEVELOPER_DIR is $DEVELOPER_DIR"
          echo "which resolves to $(cd "$DEVELOPER_DIR" && pwd -P)"
          xcodebuild -version

      - name: Build ${{ matrix.kind }}
        run: |
          bundle exec fastlane ${{ matrix.kind }} build
        env:
          P12_KEY_DISTRIBUTION: ${{ secrets.P12_KEY_DISTRIBUTION }}
          P12_VALUE_DISTRIBUTION: ${{ secrets.P12_VALUE_DISTRIBUTION }}
          P12_KEY_MAC_DEVELOPER_ID: ${{ secrets.P12_KEY_MAC_DEVELOPER_ID }}
          P12_KEY_MAC_DEVELOPER_INSTALLER: ${{ secrets.P12_KEY_MAC_DEVELOPER_INSTALLER }}
          P12_VALUE_MAC_DEVELOPER_ID: ${{ secrets.P12_VALUE_MAC_DEVELOPER_ID }}
          P12_VALUE_MAC_DEVELOPER_INSTALLER: ${{ secrets.P12_VALUE_MAC_DEVELOPER_INSTALLER }}
          HOMEASSISTANT_APPLE_ID: ${{ secrets.HOMEASSISTANT_APPLE_ID }}
          HOMEASSISTANT_APP_STORE_CONNECT_PASSWORD: ${{ secrets.HOMEASSISTANT_APP_STORE_CONNECT_PASSWORD }}
          HOMEASSISTANT_APP_STORE_CONNECT_TEAM_ID: ${{ secrets.HOMEASSISTANT_APP_STORE_CONNECT_TEAM_ID }}
          HOMEASSISTANT_TEAM_ID: ${{ secrets.HOMEASSISTANT_TEAM_ID }}
          EMERGE_API_TOKEN: ${{ secrets.EMERGE_API_TOKEN }}
          EMERGE_REPO_NAME: ${{ github.repository }}
          EMERGE_SHA: ${{ github.sha }}
          EMERGE_BASE_SHA: ${{ github.event.before }}

      - name: Dump Version Information
        run: cat Configuration/Version.xcconfig

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        name: "Upload iOS IPA"
        if: success() && matrix.kind == 'ios'
        with:
          name: ios-app-store.ipa
          path: build/ios/Home Assistant.ipa
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        name: "Upload iOS dSYMs"
        if: success() && matrix.kind == 'ios'
        with:
          name: ios.dSYM.zip
          path: build/ios/Home Assistant.app.dSYM.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        name: "Upload Mac Developer ID App"
        if: success() && matrix.kind == 'mac'
        with:
          name: mac-developer-id.zip
          path: build/macos/home-assistant-mac.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        name: "Upload Mac App Store Package"
        if: success() && matrix.kind == 'mac'
        with:
          name: mac-app-store.pkg
          path: build/macos/Home Assistant.pkg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        name: "Upload Mac dSYMs"
        if: success() && matrix.kind == 'mac'
        with:
          name: mac.dSYM.zip
          path: build/macos/Home Assistant.app.dSYM.zip
