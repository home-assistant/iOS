name: TMP Record Snapshots

# Temporary: records the reference images for the magic item tap action
# snapshot tests, which can only be produced on the simulator CI runs on.
# Delete this file once the images are committed.

permissions:
  contents: write

on:
  push:
    branches:
      - magic-item-tap-actions

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
  FASTLANE_SKIP_UPDATE_CHECK: true
  FASTLANE_XCODE_LIST_TIMEOUT: 80
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 80
  BUNDLE_PATH: vendor/bundle

jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Restore: DerivedData"
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            ${{ format('{0}-deriveddata-{1}-{2}',
            runner.os,
            env.DEVELOPER_DIR,
            hashFiles('Package.resolved')) }}
          restore-keys: >-
            ${{ format('{0}-deriveddata-{1}-',
            runner.os,
            env.DEVELOPER_DIR) }}

      # Records the reference images that are missing, then commits whatever
      # actually changed. A run that changes nothing is a no-op.
      - name: Record snapshots
        run: |
          xcodebuild test \
            -project HomeAssistant.xcodeproj \
            -scheme Tests-Unit \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            TEST_RUNNER_SNAPSHOT_TESTING_RECORD=missing \
            || true

      - name: Commit recorded snapshots
        run: |
          if [ -z "$(git status --porcelain -- Tests)" ]; then
            echo "No snapshot changed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Tests
            git commit -m "Record magic item tap action snapshots"
            git push origin HEAD:${{ github.ref_name }}
          fi

      # Verifies the suite is green against whatever the step above recorded.
      - name: Run tests
        run: bundle exec fastlane test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        name: "Upload Test Logs"
        if: ${{ always() }}
        with:
          name: test-logs
          path: |
            ~/Library/Developer/Xcode/DerivedData/HomeAssistant-*/Logs/Test
            ~/Library/Logs/scan
