# TEMPORARY — renders the Server Switching snapshot references this branch is missing and
# uploads them as an artifact, because the change was authored on a machine with no iOS
# simulator. It only reads the repository. Delete this file once the references are in.
name: TMP Record Snapshots

permissions:
  contents: read

on:
  push:
    branches:
      - claude/server-switcher-location-badge-9x3v3u

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  FASTLANE_SKIP_UPDATE_CHECK: true
  HOMEBREW_NO_INSTALL_CLEANUP: TRUE
  BUNDLE_PATH: vendor/bundle

concurrency:
  group: tmp-record-snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: .ruby-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Cache: Gems"
        id: cache_gems
        with:
          path: vendor/bundle
          key: >-
            ${{ format('{0}-gems-{1}-{2}-{3}',
            runner.os,
            env.ImageVersion,
            env.DEVELOPER_DIR,
            hashFiles('.ruby-version', '**/Gemfile.lock')) }}

      # Read-only: this job must never evict the base cache `main` warms for real CI runs.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Restore: DerivedData"
        id: derived_data
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            ${{ format('{0}-deriveddata-{1}-{2}',
            runner.os,
            env.DEVELOPER_DIR,
            hashFiles('Package.resolved')) }}
          restore-keys: >-
            ${{ format('{0}-deriveddata-{1}-',
            runner.os,
            env.DEVELOPER_DIR) }}

      - name: "Drop precompiled modules from a fallback DerivedData restore"
        if: steps.derived_data.outputs.cache-hit != 'true'
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules

      - name: Install Gems
        if: steps.cache_gems.outputs.cache-hit != 'true'
        run: bundle install --jobs 4 --retry 3

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project HomeAssistant.xcodeproj
          -scheme Tests-Unit

      # First pass: swift-snapshot-testing writes every missing reference and fails the run
      # that wrote them, which is the documented way to record. Hence continue-on-error.
      - name: "Record pass (expected to fail while it writes the references)"
        continue-on-error: true
        run: |
          xcodebuild test \
            -project HomeAssistant.xcodeproj \
            -scheme Tests-Unit \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:Tests-App/ServerSwitchingSettingsViewTests \
            -only-testing:Tests-App/LocationBasedServerSwitcherTests \
            -disableAutomaticPackageResolution \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: "Show what was recorded"
        run: git status --short && ls -la "Tests/App/Settings/__Snapshots__/ServerSwitchingSettingsView.test/"

      # Second pass: the references now exist, so this is an ordinary comparison. It has to
      # pass, otherwise what got recorded is not reproducible and must not be committed.
      - name: "Verify pass (must pass against the recorded references)"
        run: |
          xcodebuild test \
            -project HomeAssistant.xcodeproj \
            -scheme Tests-Unit \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:Tests-App/ServerSwitchingSettingsViewTests \
            -only-testing:Tests-App/LocationBasedServerSwitcherTests \
            -disableAutomaticPackageResolution \
            COMPILER_INDEX_STORE_ENABLE=NO

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        name: "Upload recorded snapshots"
        if: ${{ always() }}
        with:
          name: recorded-snapshots
          path: Tests/App/Settings/__Snapshots__/ServerSwitchingSettingsView.test/
          if-no-files-found: warn

      # The artifact lives on blob storage the authoring environment cannot reach, so also
      # print each reference as a cropped, downscaled JPEG in base64. The crop keeps the top
      # of the screen — the nav bar, the toggle and the Closest Server row — which is all the
      # badge change touches, and keeps the payload small enough to read out of the log.
      - name: "Print previews of the recorded references"
        if: ${{ always() }}
        run: |
          cat > "$RUNNER_TEMP/shrink.swift" <<'SWIFT'
          import CoreGraphics
          import Foundation
          import ImageIO
          import UniformTypeIdentifiers

          // shrink <input> <output> <cropHeight> <scale> <jpegQuality>
          let args = CommandLine.arguments
          guard args.count == 6,
                let source = CGImageSourceCreateWithURL(URL(fileURLWithPath: args[1]) as CFURL, nil),
                let image = CGImageSourceCreateImageAtIndex(source, 0, nil),
                let cropHeight = Int(args[3]),
                let scale = Double(args[4]),
                let quality = Double(args[5]) else {
              FileHandle.standardError.write(Data("shrink: bad arguments or unreadable image\n".utf8))
              exit(1)
          }
          let box = CGRect(x: 0, y: 0, width: image.width, height: min(cropHeight, image.height))
          guard let cropped = image.cropping(to: box) else { exit(1) }
          let width = Int(Double(cropped.width) * scale)
          let height = Int(Double(cropped.height) * scale)
          guard let context = CGContext(
              data: nil,
              width: width,
              height: height,
              bitsPerComponent: 8,
              bytesPerRow: 0,
              space: CGColorSpaceCreateDeviceRGB(),
              bitmapInfo: CGImageAlphaInfo.noneSkipLast.rawValue
          ) else { exit(1) }
          context.interpolationQuality = .high
          context.draw(cropped, in: CGRect(x: 0, y: 0, width: width, height: height))
          guard let output = context.makeImage(),
                let destination = CGImageDestinationCreateWithURL(
                    URL(fileURLWithPath: args[2]) as CFURL,
                    UTType.jpeg.identifier as CFString,
                    1,
                    nil
                ) else { exit(1) }
          CGImageDestinationAddImage(
              destination,
              output,
              [kCGImageDestinationLossyCompressionQuality: quality] as CFDictionary
          )
          guard CGImageDestinationFinalize(destination) else { exit(1) }
          SWIFT

          cd "Tests/App/Settings/__Snapshots__/ServerSwitchingSettingsView.test"
          # Dark first, light last: only the tail of the log is retrievable, so the variants
          # that matter most have to be the ones printed last.
          for name in \
            serverSwitchingScreenWithClosestServer.dark \
            serverSwitchingScreenWithClosestServerOnHomeNetwork.dark \
            serverSwitchingScreenWithClosestServer.light \
            serverSwitchingScreenWithClosestServerOnHomeNetwork.light; do
            [ -f "$name.png" ] || { echo "MISSING $name.png"; continue; }
            swift "$RUNNER_TEMP/shrink.swift" "$name.png" "$RUNNER_TEMP/$name.jpg" 1150 0.5 0.55
            echo "PREVIEW-BYTES $name $(wc -c < "$RUNNER_TEMP/$name.jpg")"
            echo "===BEGIN $name==="
            base64 < "$RUNNER_TEMP/$name.jpg"
            echo "===END $name==="
          done
