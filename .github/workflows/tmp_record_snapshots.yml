name: TEMP Record Snapshots

# Temporary workflow: re-records the kiosk settings reference images, which this branch's new row
# and the hide-settings-entry row from main both change, then checks they reproduce and pushes them.
# Snapshot tests record whatever reference is missing and fail while doing it, so the recording step
# tolerates that failure and the verifying step does not. The commit it pushes only touches
# `__Snapshots__`, which this workflow ignores, so it does not trigger itself. Delete this file once
# the snapshots are in.

on:
  push:
    branches:
      - feature/kiosk-command-confirmation-toggle
    paths-ignore:
      - "**/__Snapshots__/**"

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
  FASTLANE_SKIP_UPDATE_CHECK: true
  HOMEBREW_NO_INSTALL_CLEANUP: TRUE
  BUNDLE_PATH: vendor/bundle

concurrency:
  group: tmp-record-snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: .ruby-version

      # Read-only restore of the DerivedData `main` warms in the `test` job of ci.yml, so the
      # pinned SPM dependencies are reused instead of compiled from scratch.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Restore: DerivedData"
        id: derived_data
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            ${{ format('{0}-deriveddata-{1}-{2}',
            runner.os,
            env.DEVELOPER_DIR,
            hashFiles('Package.resolved')) }}
          restore-keys: >-
            ${{ format('{0}-deriveddata-{1}-',
            runner.os,
            env.DEVELOPER_DIR) }}

      - name: "Drop precompiled modules from a fallback DerivedData restore"
        if: steps.derived_data.outputs.cache-hit != 'true'
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules

      - name: Install Gems
        run: bundle install --jobs 4 --retry 3

      - name: Record missing snapshots
        continue-on-error: true
        env:
          # Forwarded into the test process with the prefix stripped, so swift-snapshot-testing
          # writes the references it does not have yet.
          TEST_RUNNER_SNAPSHOT_TESTING_RECORD: missing
        run: |
          xcodebuild test \
            -project HomeAssistant.xcodeproj \
            -scheme Tests-Unit \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:Tests-App/KioskSettingsViewTests \
            -only-testing:Tests-App/KioskHideSettingsEntryTests \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO

      # Runs the kiosk suites again, now that the references exist, so the run also proves the
      # snapshots reproduce and the tests around them pass. This one is not tolerated, and a
      # reference that does not reproduce is never committed.
      - name: Verify the kiosk tests against the recorded snapshots
        env:
          TEST_RUNNER_SNAPSHOT_TESTING_RECORD: never
        run: |
          xcodebuild test \
            -project HomeAssistant.xcodeproj \
            -scheme Tests-Unit \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:Tests-App/KioskSettingsViewTests \
            -only-testing:Tests-App/KioskHideSettingsEntryTests \
            -only-testing:Tests-App/KioskSettingsEntryIconTests \
            -only-testing:Tests-App/KioskPushPresentationTests \
            -only-testing:Tests-App/KioskPushCommandTests \
            -only-testing:Tests-App/KioskSettingsTests \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Commit recorded snapshots
        run: |
          if [ -z "$(git status --porcelain Tests)" ]; then
            echo "No snapshots were recorded, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tests
          git commit -m "Re-record kiosk settings snapshot references"
          git push origin HEAD:${{ github.ref_name }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        name: "Upload Recorded Snapshots"
        if: ${{ always() }}
        with:
          name: recorded-snapshots
          path: Tests/App/Kiosk/__Snapshots__
          if-no-files-found: ignore
