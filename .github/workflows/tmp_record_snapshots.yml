# TEMPORARY — renders the Server Switching snapshot references this branch is missing and
# uploads them as an artifact, because the change was authored on a machine with no iOS
# simulator. It only reads the repository. Delete this file once the references are in.
name: TMP Record Snapshots

permissions:
  contents: read

on:
  push:
    branches:
      - claude/server-switcher-location-badge-9x3v3u

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  FASTLANE_SKIP_UPDATE_CHECK: true
  HOMEBREW_NO_INSTALL_CLEANUP: TRUE
  BUNDLE_PATH: vendor/bundle

concurrency:
  group: tmp-record-snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: .ruby-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Cache: Gems"
        id: cache_gems
        with:
          path: vendor/bundle
          key: >-
            ${{ format('{0}-gems-{1}-{2}-{3}',
            runner.os,
            env.ImageVersion,
            env.DEVELOPER_DIR,
            hashFiles('.ruby-version', '**/Gemfile.lock')) }}

      # Read-only: this job must never evict the base cache `main` warms for real CI runs.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Restore: DerivedData"
        id: derived_data
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            ${{ format('{0}-deriveddata-{1}-{2}',
            runner.os,
            env.DEVELOPER_DIR,
            hashFiles('Package.resolved')) }}
          restore-keys: >-
            ${{ format('{0}-deriveddata-{1}-',
            runner.os,
            env.DEVELOPER_DIR) }}

      - name: "Drop precompiled modules from a fallback DerivedData restore"
        if: steps.derived_data.outputs.cache-hit != 'true'
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules

      - name: Install Gems
        if: steps.cache_gems.outputs.cache-hit != 'true'
        run: bundle install --jobs 4 --retry 3

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project HomeAssistant.xcodeproj
          -scheme Tests-Unit

      # First pass: swift-snapshot-testing writes every missing reference and fails the run
      # that wrote them, which is the documented way to record. Hence continue-on-error.
      - name: "Record pass (expected to fail while it writes the references)"
        continue-on-error: true
        run: |
          xcodebuild test \
            -project HomeAssistant.xcodeproj \
            -scheme Tests-Unit \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:Tests-App/ServerSwitchingSettingsViewTests \
            -only-testing:Tests-App/ClosestServerSourceBadgeTests \
            -only-testing:Tests-App/LocationBasedServerSwitcherTests \
            -disableAutomaticPackageResolution \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: "Show what was recorded"
        run: git status --short && ls -lR "Tests/App/Settings/__Snapshots__/"

      # Second pass: the references now exist, so this is an ordinary comparison. It has to
      # pass, otherwise what got recorded is not reproducible and must not be committed.
      - name: "Verify pass (must pass against the recorded references)"
        run: |
          xcodebuild test \
            -project HomeAssistant.xcodeproj \
            -scheme Tests-Unit \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:Tests-App/ServerSwitchingSettingsViewTests \
            -only-testing:Tests-App/ClosestServerSourceBadgeTests \
            -only-testing:Tests-App/LocationBasedServerSwitcherTests \
            -disableAutomaticPackageResolution \
            COMPILER_INDEX_STORE_ENABLE=NO

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        name: "Upload recorded snapshots"
        if: ${{ always() }}
        with:
          name: recorded-snapshots
          path: |
            Tests/App/Settings/__Snapshots__/ServerSwitchingSettingsView.test/
            Tests/App/Settings/__Snapshots__/ClosestServerSourceBadge.test/
          if-no-files-found: warn

      # The artifact lives on blob storage the authoring environment cannot reach, so hand the
      # references over through the log instead: base64, wrapped wide so the per-line timestamp
      # the runner prepends stays a rounding error. Only the references this change records are
      # dumped — the ones already in the repository are unchanged and would just be bulk.
      - name: "Dump the recorded references"
        if: ${{ always() }}
        run: |
          snapshots="Tests/App/Settings/__Snapshots__"
          badge="$snapshots/ClosestServerSourceBadge.test"
          screen="$snapshots/ServerSwitchingSettingsView.test"
          closest="serverSwitchingScreenWithClosestServer"
          for path in \
            "$badge/badgeSources.light.png" \
            "$badge/badgeSources.dark.png" \
            "$screen/$closest.light.png" \
            "$screen/$closest.dark.png" \
            "$screen/${closest}OnHomeNetwork.light.png" \
            "$screen/${closest}OnHomeNetwork.dark.png"; do
            [ -f "$path" ] || { echo "MISSING $path"; continue; }
            echo "DUMP-BYTES $path $(wc -c < "$path") $(shasum -a 256 < "$path" | cut -d" " -f1)"
            echo "===BEGIN $path==="
            base64 < "$path" | tr -d "\n" | fold -w 3000
            echo ""
            echo "===END $path==="
          done
