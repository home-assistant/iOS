name: Sendspin (temporary)

# TEMPORARY - delete before merging. Runs the unit tests on a Mac for the Sendspin branch, records
# the reference images of its new snapshot tests and commits them back to the branch, together
# with Strings.swift as SwiftGen regenerates it during the build. Nothing else writes back.

permissions:
  contents: write

on:
  push:
    branches:
      - claude/sendspin-music-assistant-player
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  FASTLANE_SKIP_UPDATE_CHECK: true
  FASTLANE_XCODE_LIST_TIMEOUT: 80
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 80
  HOMEBREW_NO_INSTALL_CLEANUP: TRUE
  BUNDLE_PATH: vendor/bundle

concurrency:
  group: sendspin-tmp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: SwiftLint
        run: |
          docker run --rm -v `pwd`:`pwd` -w `pwd` \
            ghcr.io/realm/swiftlint:0.54.0 \
            swiftlint lint --strict --config .swiftlint.yml --reporter github-actions-logging
      - name: SwiftFormat
        run: |
          docker run --rm -v `pwd`:`pwd` -w `pwd` \
            ghcr.io/nicklockwood/swiftformat:0.53.1 \
            --lint --config .swiftformat .
      - name: Unused strings
        continue-on-error: true
        run: python3 Tools/detect_unused_strings.py

  test:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83  # v1.328.0
        with:
          ruby-version: .ruby-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Cache: Gems"
        id: cache_gems
        with:
          path: vendor/bundle
          key: >-
            ${{ format('{0}-gems-{1}-{2}-{3}',
            runner.os,
            env.ImageVersion,
            env.DEVELOPER_DIR,
            hashFiles('.ruby-version', '**/Gemfile.lock')) }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Restore: DerivedData"
        id: derived_data
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            ${{ format('{0}-deriveddata-{1}-{2}',
            runner.os,
            env.DEVELOPER_DIR,
            hashFiles('Package.resolved')) }}
          restore-keys: >-
            ${{ format('{0}-deriveddata-{1}-',
            runner.os,
            env.DEVELOPER_DIR) }}

      - name: "Drop precompiled modules from a fallback DerivedData restore"
        if: steps.derived_data.outputs.cache-hit != 'true'
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules

      - name: Install Gems
        if: steps.cache_gems.outputs.cache-hit != 'true'
        run: bundle install --jobs 4 --retry 3

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project HomeAssistant.xcodeproj
          -scheme Tests-Unit

      # A missing reference image fails its test once while it is recorded, so the run is allowed
      # to fail here; the summary below says what actually failed.
      - name: Run tests
        id: tests
        continue-on-error: true
        run: bundle exec fastlane test

      - name: Summarize failures
        if: always()
        run: |
          RESULT=fastlane/test_output/Tests-Unit.xcresult
          if [ -d "$RESULT" ]; then
            xcrun xcresulttool get test-results tests --path "$RESULT" --compact > tests.json || true
            python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          def walk(node, path):
              name = node.get("name", "")
              if node.get("result") == "Failed" and node.get("nodeType") in ("Test Case", "Test Case Run"):
                  print(f"- FAILED {' / '.join(path + [name])}")
                  for child in node.get("children", []):
                      if child.get("nodeType") == "Failure Message":
                          print(f"    {child.get('name', '')}")
              for child in node.get("children", []):
                  walk(child, path + [name])
          try:
              data = json.load(open("tests.json"))
          except Exception as error:
              print(f"could not read test results: {error}")
              raise SystemExit
          for node in data.get("testNodes", []):
              walk(node, [])
          EOF
          else
            echo "No result bundle: the build failed before tests ran." | tee -a "$GITHUB_STEP_SUMMARY"
            find ~/Library/Logs/scan -name '*.log' -exec tail -n 400 {} \; || true
          fi

      - name: Patch coverage
        if: always()
        continue-on-error: true
        run: |
          python3 Tools/xccov_to_lcov.py fastlane/test_output/Tests-Unit.xcresult \
            --lcov fastlane/test_output/coverage.lcov
          python3 Tools/diff_coverage.py fastlane/test_output/coverage.lcov --base origin/main \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit recorded snapshots and regenerated strings
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tests/App/Sendspin/__Snapshots__ Sources/Shared/Resources/Swiftgen/Strings.swift || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Record Sendspin snapshots"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        name: "Upload Test Logs"
        if: always()
        with:
          name: sendspin-test-logs
          path: |
            ~/Library/Logs/scan
            fastlane/test_output/Tests-Unit.xcresult
            Tests/**/__Snapshots__/**/*.png
