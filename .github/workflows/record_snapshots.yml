# Temporary: records the snapshot references for this branch on a mac runner and
# commits them back. Delete before opening the pull request.
name: Record Snapshots

permissions:
  contents: write

on:
  push:
    branches:
      - claude/complication-icon-color-watch-iqh2hf

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
  FASTLANE_SKIP_UPDATE_CHECK: true
  FASTLANE_XCODE_LIST_TIMEOUT: 80
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 80
  BUNDLE_PATH: vendor/bundle

jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: .ruby-version

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Restore: DerivedData"
        id: derived_data
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            ${{ format('{0}-deriveddata-{1}-{2}',
            runner.os,
            env.DEVELOPER_DIR,
            hashFiles('Package.resolved')) }}
          restore-keys: >-
            ${{ format('{0}-deriveddata-{1}-',
            runner.os,
            env.DEVELOPER_DIR) }}

      - name: "Drop precompiled modules from a fallback DerivedData restore"
        if: steps.derived_data.outputs.cache-hit != 'true'
        run: >-
          rm -rf
          ~/Library/Developer/Xcode/DerivedData/*/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules

      - name: Install Gems
        run: bundle install --jobs 4 --retry 3

      # A missing reference is recorded and then reported as a failure, which aborts the
      # lane before the watchOS suite it runs second. Repeat until a run comes back green:
      # the first records the iOS references, the second the watchOS ones, the third asserts
      # against both.
      - name: Record snapshots
        id: record
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            echo "::group::fastlane test (attempt $attempt)"
            if bundle exec fastlane test; then
              echo "::endgroup::"
              echo "Tests passed on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
          done
          echo "Tests still failing after 3 attempts"
          exit 1

      - name: Report patch coverage
        continue-on-error: true
        run: |
          python3 Tools/xccov_to_lcov.py fastlane/test_output/Tests-Unit.xcresult \
            --lcov fastlane/test_output/coverage.lcov \
            --summary "$GITHUB_STEP_SUMMARY"
          python3 Tools/diff_coverage.py fastlane/test_output/coverage.lcov \
            --base origin/main \
            --threshold 90 \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Commit recorded snapshots
        run: |
          find Tests -name '*.failure.png' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tests
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
            exit 0
          fi
          git commit -m "Record complication icon color snapshot references"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ always() }}
        with:
          name: test-logs
          path: |
            ~/Library/Logs/scan
            ~/Library/Developer/Xcode/DerivedData/HomeAssistant-*/Logs/Test
          if-no-files-found: ignore
