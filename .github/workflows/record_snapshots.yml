# Temporary: records the snapshot references this branch changes, on a machine
# that can run the simulator. Delete once the references are committed.
name: Record Snapshots

permissions:
  contents: write

on:
  push:
    branches:
      - areas-widget-measured-tile-height

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  FASTLANE_SKIP_UPDATE_CHECK: true
  FASTLANE_XCODE_LIST_TIMEOUT: 80
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 80
  BUNDLE_PATH: vendor/bundle

concurrency:
  group: record-snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: .ruby-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Cache: Gems"
        id: cache_gems
        with:
          path: vendor/bundle
          key: >-
            ${{ format('{0}-gems-{1}-{2}-{3}',
            runner.os,
            env.ImageVersion,
            env.DEVELOPER_DIR,
            hashFiles('.ruby-version', '**/Gemfile.lock')) }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Restore: DerivedData"
        id: derived_data
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            ${{ format('{0}-deriveddata-{1}-{2}',
            runner.os,
            env.DEVELOPER_DIR,
            hashFiles('Package.resolved')) }}
          restore-keys: >-
            ${{ format('{0}-deriveddata-{1}-',
            runner.os,
            env.DEVELOPER_DIR) }}

      - name: "Drop precompiled modules from a fallback DerivedData restore"
        if: steps.derived_data.outputs.cache-hit != 'true'
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules

      - name: Install Gems
        if: steps.cache_gems.outputs.cache-hit != 'true'
        run: bundle install --jobs 4 --retry 3

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project HomeAssistant.xcodeproj
          -scheme Tests-Unit

      # `failed` records the references that are missing or that no longer match, and
      # leaves every other one byte for byte as it is. Recording is a test failure by
      # design, so the run carries on to the commit below.
      - name: Run tests, recording what changed
        continue-on-error: true
        env:
          TEST_RUNNER_SNAPSHOT_TESTING_RECORD: failed
        run: bundle exec fastlane test

      - name: Commit the recorded references
        run: |
          git add -A -- Tests
          if git diff --cached --quiet; then
            echo "Nothing to record."
            exit 0
          fi
          git diff --cached --stat
          git -c user.name="Bruno Pantaleão Gonçalves" \
              -c user.email="5808343+bgoncal@users.noreply.github.com" \
              commit -m "Record the widget snapshot references"
          git push origin HEAD:${{ github.ref_name }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        name: "Upload Test Logs"
        if: ${{ always() }}
        with:
          name: record-test-logs
          path: |
            ~/Library/Logs/scan
            fastlane/test_output/Tests-Unit.xcresult
