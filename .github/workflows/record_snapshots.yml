name: Record Snapshots (temporary)

# Temporary helper for the widget tile max height change: re-records the snapshot references the
# change moves, on a macOS runner, and commits them back to the branch. Runs only on that branch,
# and is deleted once the references are in.

on:
  push:
    branches:
      - claude/entity-tile-max-height-izkv2m
  workflow_dispatch:

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  FASTLANE_SKIP_UPDATE_CHECK: true
  FASTLANE_XCODE_LIST_TIMEOUT: 80
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 80
  BUNDLE_PATH: vendor/bundle

concurrency:
  group: record-snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: .ruby-version

      # Read-only: the warmed cache `main` saves is what keeps this from compiling every
      # dependency from scratch, and a run on this branch must not evict it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Restore: DerivedData"
        id: derived_data
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            ${{ format('{0}-deriveddata-{1}-{2}',
            runner.os,
            env.DEVELOPER_DIR,
            hashFiles('Package.resolved')) }}
          restore-keys: >-
            ${{ format('{0}-deriveddata-{1}-',
            runner.os,
            env.DEVELOPER_DIR) }}

      - name: "Drop precompiled modules from a fallback DerivedData restore"
        if: steps.derived_data.outputs.cache-hit != 'true'
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules

      - name: Install Gems
        run: bundle install --jobs 4 --retry 3

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project HomeAssistant.xcodeproj
          -scheme Tests-Unit

      # `failed` records only the references that no longer match, so snapshots the change does
      # not touch keep the bytes they were recorded with. Recording is itself a test failure,
      # which is what the verification run at the end is for.
      - name: Record the snapshots the change moves
        continue-on-error: true
        env:
          SNAPSHOT_TESTING_RECORD: failed
          TEST_RUNNER_SNAPSHOT_TESTING_RECORD: failed
        run: bundle exec fastlane test

      - name: Commit the re-recorded references
        run: |
          if [ -z "$(git status --porcelain -- Tests)" ]; then
            echo "No reference changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Tests
          git commit -m "Re-record widget snapshots for the tile height cap"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # The references are only worth committing if the suite passes against them.
      - name: Verify the suite against the recorded references
        run: bundle exec fastlane test
