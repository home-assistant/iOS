# TEMPORARY — remove before merging.
#
# Records the reference images for the Entities widget snapshot tests on a macOS runner, commits
# them back to the branch, and re-runs the unit tests against them. Also runs the same lint gates
# as CI so formatting problems surface without opening a pull request.
name: "Temp: Record Entities widget snapshots"

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - claude/entities-widget-v862qm

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
  FASTLANE_SKIP_UPDATE_CHECK: true
  FASTLANE_XCODE_LIST_TIMEOUT: 80
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 80
  HOMEBREW_NO_INSTALL_CLEANUP: TRUE
  BUNDLE_PATH: vendor/bundle

concurrency:
  group: temp-record-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: YamlLint
        run: yamllint --strict --format github .
      - name: RuboCop
        run: bundle exec rubocop --format github
      - name: SwiftLint
        run: |
          docker run --rm -v `pwd`:`pwd` -w `pwd` \
            ghcr.io/realm/swiftlint:0.54.0 \
            swiftlint lint --strict --config .swiftlint.yml --reporter github-actions-logging
      - name: SwiftFormat
        run: |
          docker run --rm -v `pwd`:`pwd` -w `pwd` \
            ghcr.io/nicklockwood/swiftformat:0.53.1 \
            --lint --config .swiftformat .

  record:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: .ruby-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Cache: Gems"
        id: cache_gems
        with:
          path: vendor/bundle
          key: >-
            ${{ format('{0}-gems-{1}-{2}-{3}',
            runner.os,
            env.ImageVersion,
            env.DEVELOPER_DIR,
            hashFiles('.ruby-version', '**/Gemfile.lock')) }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Restore: DerivedData"
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            ${{ format('{0}-deriveddata-{1}-{2}',
            runner.os,
            env.DEVELOPER_DIR,
            hashFiles('Package.resolved')) }}
          restore-keys: >-
            ${{ format('{0}-deriveddata-{1}-',
            runner.os,
            env.DEVELOPER_DIR) }}

      - name: Install Gems
        if: steps.cache_gems.outputs.cache-hit != 'true'
        run: bundle install --jobs 4 --retry 3

      # A snapshot test with no reference image records one and fails, so this first pass is
      # expected to fail on exactly the new tests. Anything else that fails here shows up again
      # in the verification pass below.
      - name: Record missing snapshots
        id: record
        continue-on-error: true
        run: bundle exec fastlane test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        name: "Upload recorded snapshots"
        if: ${{ always() }}
        with:
          name: entities-widget-snapshots
          path: Tests/Widgets/__Snapshots__/WidgetEntitiesSnapshot.test
          if-no-files-found: warn

      - name: Commit recorded snapshots
        id: commit
        run: |
          git add -A Tests
          if git diff --cached --quiet; then
            echo "No snapshots were recorded."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record Entities widget snapshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Verify tests pass against the recorded snapshots
        run: bundle exec fastlane test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        name: "Upload Test Logs"
        if: ${{ always() }}
        with:
          name: test-logs
          path: |
            ~/Library/Logs/DiagnosticReports
            ~/Library/Developer/Xcode/DerivedData/HomeAssistant-*/Logs/Test
            ~/Library/Logs/scan
            fastlane/test_output
