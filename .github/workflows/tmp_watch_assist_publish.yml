name: TMP Watch Assist screenshots publish

on:
  push:
    branches:
      - watch-assist-push-to-talk-screenshots
    paths:
      - .github/workflows/tmp_watch_assist_publish.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: "37156491365"
  SOURCE_ARTIFACT: watch-assist-screenshots-2

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact

      - name: Encode screenshots
        run: |
          ls -laR artifact
          pip install --quiet pillow
          python3 - <<'PY'
          import base64, hashlib, io, pathlib
          from PIL import Image
          out = pathlib.Path("encoded"); out.mkdir(exist_ok=True)
          summary = []
          for png in sorted(pathlib.Path("artifact/screenshots").glob("*.png")):
              raw = png.read_bytes()
              im = Image.open(png).convert("RGB")
              for quality in (85, 75, 65, 55, 45):
                  buf = io.BytesIO(); im.save(buf, "JPEG", quality=quality, optimize=True)
                  b64 = base64.b64encode(buf.getvalue()).decode()
                  if len(b64) <= 64000:
                      break
              (out / f"{png.stem}.b64").write_text(b64)
              colors = len(set(im.getdata()))
              summary.append(f"{png.stem} size={im.size} png={len(raw)} pngsha={hashlib.sha256(raw).hexdigest()[:12]} colors={colors} jpegq={quality} b64={len(b64)}")
          text = " | ".join(summary)
          print(text)
          print(f"::notice title=img-summary::{text}")
          PY

      - name: Annotate idle part 1
        run: |
          python3 - encoded/idle.b64 1 9 <<'PY'
          import sys, zlib, pathlib
          p = pathlib.Path(sys.argv[1]); lo, hi = int(sys.argv[2]), int(sys.argv[3])
          if not p.exists(): sys.exit(0)
          s = p.read_text(); n = 4000
          chunks = [s[i:i+n] for i in range(0, len(s), n)]
          for i, c in enumerate(chunks, 1):
              if lo <= i <= hi:
                  print(f"::notice title=img {p.stem} {i}/{len(chunks)} crc={zlib.crc32(c.encode()):08x}::{c}")
          PY

      - name: Annotate idle part 2
        run: |
          python3 - encoded/idle.b64 10 18 <<'PY'
          import sys, zlib, pathlib
          p = pathlib.Path(sys.argv[1]); lo, hi = int(sys.argv[2]), int(sys.argv[3])
          if not p.exists(): sys.exit(0)
