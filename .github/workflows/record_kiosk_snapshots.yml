name: Record Kiosk Snapshots

# Temporary workflow: lints the branch, records the reference images for the kiosk settings-entry
# snapshot tests on a macOS runner and commits them back to the branch. Delete once they are in.

permissions:
  contents: write

on:
  push:
    branches:
      - claude/kiosk-entry-button-toggle-denenw
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
  FASTLANE_SKIP_UPDATE_CHECK: true
  HOMEBREW_NO_INSTALL_CLEANUP: TRUE
  BUNDLE_PATH: vendor/bundle

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: YamlLint
        run: yamllint --strict --format github .
      - name: SwiftLint
        run: |
          docker run --rm -v `pwd`:`pwd` -w `pwd` \
            ghcr.io/realm/swiftlint:0.54.0 \
            swiftlint lint --strict --config .swiftlint.yml --reporter github-actions-logging
      - name: SwiftFormat
        run: |
          docker run --rm -v `pwd`:`pwd` -w `pwd` \
            ghcr.io/nicklockwood/swiftformat:0.53.1 \
            --lint --config .swiftformat .

  record:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Restore: DerivedData"
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            ${{ format('{0}-deriveddata-{1}-{2}',
            runner.os,
            env.DEVELOPER_DIR,
            hashFiles('Package.resolved')) }}
          restore-keys: >-
            ${{ format('{0}-deriveddata-{1}-',
            runner.os,
            env.DEVELOPER_DIR) }}

      # First run records the missing reference images into the checkout (and fails the test run
      # doing so); once they are committed, the same run asserts against them instead.
      - name: Record or verify snapshots
        run: |
          xcodebuild test \
            -project HomeAssistant.xcodeproj \
            -scheme Tests-Unit \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -only-testing:Tests-App/KioskHideSettingsEntryTests \
            -only-testing:Tests-App/KioskSettingsEntryIconTests \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || true

      - name: Commit recorded snapshots
        if: always()
        run: |
          if [ -z "$(git status --porcelain Tests/App/Kiosk)" ]; then
            echo "nothing was recorded"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tests/App/Kiosk
          git commit -m "Record the kiosk settings-entry snapshots"
          git push origin "HEAD:$GITHUB_REF_NAME"

      # Last, so a tail of the job log is the interesting part.
      - name: Report the outcome
        if: always()
        run: |
          echo "===== test results ====="
          grep -nE "error:|error generated|✘|Test run with|TEST (FAILED|SUCCEEDED)" \
            "$RUNNER_TEMP/xcodebuild.log" | head -n 60 || echo "none matched"
          echo "===== log tail ====="
          tail -n 30 "$RUNNER_TEMP/xcodebuild.log"
          # Now that the references are committed, anything short of a pass is a real failure.
          grep -q '\*\* TEST SUCCEEDED \*\*' "$RUNNER_TEMP/xcodebuild.log"
