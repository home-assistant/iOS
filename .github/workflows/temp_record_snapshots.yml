# TEMPORARY — delete before this branch is merged.
#
# Records the snapshot references this branch changes on the same runner CI compares them on, and
# commits them back to the branch. Snapshot tests can only render on macOS with Xcode, which the
# environment the change was written in does not have.
name: "TEMP: Record snapshots"

permissions:
  contents: write

on:
  push:
    branches:
      - fix-widget-icon-inactive-color
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  FASTLANE_SKIP_UPDATE_CHECK: true
  FASTLANE_XCODE_LIST_TIMEOUT: 80
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 80
  HOMEBREW_NO_INSTALL_CLEANUP: TRUE
  BUNDLE_PATH: vendor/bundle

concurrency:
  group: temp-record-snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: SwiftLint
        run: |
          docker run --rm -v `pwd`:`pwd` -w `pwd` \
            ghcr.io/realm/swiftlint:0.54.0 \
            swiftlint lint --strict --config .swiftlint.yml --reporter github-actions-logging

  record:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8  # v1.327.0
        with:
          ruby-version: .ruby-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Cache: Gems"
        id: cache_gems
        with:
          path: vendor/bundle
          key: >-
            ${{ format('{0}-gems-{1}-{2}-{3}',
            runner.os,
            env.ImageVersion,
            env.DEVELOPER_DIR,
            hashFiles('.ruby-version', '**/Gemfile.lock')) }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Restore: DerivedData"
        id: derived_data
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            ${{ format('{0}-deriveddata-{1}-{2}',
            runner.os,
            env.DEVELOPER_DIR,
            hashFiles('Package.resolved')) }}
          restore-keys: >-
            ${{ format('{0}-deriveddata-{1}-',
            runner.os,
            env.DEVELOPER_DIR) }}

      - name: "Drop precompiled modules from a fallback DerivedData restore"
        if: steps.derived_data.outputs.cache-hit != 'true'
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules

      - name: Install Gems
        if: steps.cache_gems.outputs.cache-hit != 'true'
        run: bundle install --jobs 4 --retry 3

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project HomeAssistant.xcodeproj
          -scheme Tests-Unit

      # xcodebuild hands `TEST_RUNNER_`-prefixed variables to the test process without the prefix,
      # and SnapshotTesting re-records every reference that is missing or no longer matches. Those
      # tests still fail this run, so the step is allowed to; the logs say which ones did.
      - name: Run tests, recording snapshots that changed
        id: tests
        continue-on-error: true
        env:
          TEST_RUNNER_SNAPSHOT_TESTING_RECORD: failed
        run: bundle exec fastlane test

      # The lane stops at the first scheme that fails, and recording always fails the iOS run, so the
      # watch scheme gets a step of its own to prove the watch app still builds and passes.
      - name: Run watch tests
        continue-on-error: true
        env:
          TEST_RUNNER_SNAPSHOT_TESTING_RECORD: failed
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          matches = [
              (runtime, device)
              for runtime, entries in devices.items() if "watchOS" in runtime
              for device in entries if device["name"] == "Apple Watch Series 12 (46mm)"
          ]
          print(max(matches, key=lambda match: [int(n) for n in re.findall(r"\d+", match[0])])[1]["udid"])
          ')
          set -o pipefail
          xcodebuild test \
            -project HomeAssistant.xcodeproj \
            -scheme WatchApp \
            -only-testing:HomeAssistant-WatchAppTests \
            -destination "platform=watchOS Simulator,id=$udid" \
            -disableAutomaticPackageResolution \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 \
            | grep -E "error:|\*\* [A-Z ]+ \*\*|Test Suite|Executed|passed after|failed after" | tail -200

      - name: Commit recorded snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':(glob)**/__Snapshots__/**'
          if git diff --cached --quiet; then
            echo "No snapshot changed."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Record snapshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        name: "Upload Test Logs"
        if: ${{ always() }}
        with:
          name: test-logs
          path: |
            ~/Library/Logs/scan
            fastlane/test_output/Tests-Unit.xcresult
