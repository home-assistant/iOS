name: TMP Watch Assist screenshots

on:
  push:
    branches:
      - watch-assist-push-to-talk-screenshots
    paths:
      - "Sources/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  screenshots:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project HomeAssistant.xcodeproj
          -scheme WatchApp

      - name: Pick and boot a watch simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          best = None
          for runtime, items in devices.items():
              if "watchOS" not in runtime:
                  continue
              version = [int(x) for x in re.findall(r"\d+", runtime)]
              for device in items:
                  preferred = device["name"] == "Apple Watch Series 12 (46mm)"
                  key = (preferred, version)
                  if best is None or key > best[0]:
                      best = (key, device["udid"], device["name"], runtime)
          print(best[1])
          print(best[2], best[3], file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build watch app
        run: |
          set -o pipefail
          xcodebuild build \
            -project HomeAssistant.xcodeproj \
            -scheme WatchApp \
            -configuration Debug \
            -destination "platform=watchOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            > build.log 2>&1 || { tail -300 build.log; exit 1; }
          grep -E "error:" build.log || true

      - name: Take screenshots
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find build/Build/Products -maxdepth 2 -name "HomeAssistant-WatchApp.app" | head -1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots logs
          xcrun simctl launch \
            --stdout="$PWD/logs/cycle.stdout.log" --stderr="$PWD/logs/cycle.stderr.log" \
            "$UDID" "$BUNDLE_ID" "assist-screenshot=cycle"
          launched=$(date +%s)
          shoot() {
            while [ $(( $(date +%s) - launched )) -lt "$2" ]; do sleep 1; done
            xcrun simctl io "$UDID" screenshot "screenshots/$1.png"
          }
          shoot idle 10
          shoot recording-tap 24
          shoot recording-release 39
          ls -la screenshots
          tail -n 40 logs/*.log || true

      - name: Encode screenshots
        run: |
          mkdir -p encoded
          for f in screenshots/*.png; do
            name=$(basename "$f" .png)
            sips -s format jpeg -s formatOptions 80 "$f" --out "encoded/$name.jpg" >/dev/null
            base64 -i "encoded/$name.jpg" | tr -d '\n' > "encoded/$name.b64"
            echo "::notice title=img-summary $name::png=$(wc -c < "$f") jpg=$(wc -c < "encoded/$name.jpg") b64=$(wc -c < "encoded/$name.b64")"
          done
          cat > annotate.py <<'PY'
          import sys, zlib, pathlib
          p = pathlib.Path(sys.argv[1]); lo, hi = int(sys.argv[2]), int(sys.argv[3])
          if not p.exists(): sys.exit(0)
          s = p.read_text(); n = 4000
          chunks = [s[i:i+n] for i in range(0, len(s), n)]
          for i, c in enumerate(chunks, 1):
              if lo <= i <= hi:
                  print(f"::notice title=img {p.stem} {i}/{len(chunks)} crc={zlib.crc32(c.encode()):08x}::{c}")
          PY

      - name: Annotate idle part 1
        run: python3 annotate.py encoded/idle.b64 1 9

      - name: Annotate idle part 2
        run: python3 annotate.py encoded/idle.b64 10 18

      - name: Annotate recording-tap part 1
        run: python3 annotate.py encoded/recording-tap.b64 1 9

      - name: Annotate recording-tap part 2
        run: python3 annotate.py encoded/recording-tap.b64 10 18

      - name: Annotate recording-release part 1
        run: python3 annotate.py encoded/recording-release.b64 1 9

      - name: Annotate recording-release part 2
        run: python3 annotate.py encoded/recording-release.b64 10 18

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: watch-assist-screenshots-3
          path: |
            screenshots
            logs
            build.log
