name: TMP Watch Assist screenshots

on:
  push:
    branches:
      - watch-assist-push-to-talk-screenshots
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  show:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: watch-assist-screenshots
          run-id: 37153090514
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact

      - name: Print screenshots as base64
        run: |
          ls -laR artifact/screenshots
          for f in artifact/screenshots/*.png; do
            name=$(basename "$f")
            echo "BEGIN_IMAGE $name $(wc -c < "$f") $(sha256sum "$f" | cut -c1-16)"
            base64 -w 0 "$f"
            echo
            echo "END_IMAGE $name"
          done
