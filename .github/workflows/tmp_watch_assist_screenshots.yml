name: TMP Watch Assist screenshots

on:
  push:
    branches:
      - watch-assist-push-to-talk-screenshots
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  screenshots:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project HomeAssistant.xcodeproj
          -scheme WatchApp

      - name: Pick and boot a watch simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          best = None
          for runtime, items in devices.items():
              if "watchOS" not in runtime:
                  continue
              version = [int(x) for x in re.findall(r"\d+", runtime)]
              for device in items:
                  preferred = device["name"] == "Apple Watch Series 12 (46mm)"
                  key = (preferred, version)
                  if best is None or key > best[0]:
                      best = (key, device["udid"], device["name"], runtime)
          print(best[1])
          print(best[2], best[3], file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build watch app
        run: |
          set -o pipefail
          xcodebuild build \
            -project HomeAssistant.xcodeproj \
            -scheme WatchApp \
            -configuration Debug \
            -destination "platform=watchOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            > build.log 2>&1 || { tail -300 build.log; exit 1; }
          grep -E "warning: .*WatchAssist|error:" build.log || true

      - name: Take screenshots
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find build/Build/Products -maxdepth 2 -name "HomeAssistant-WatchApp.app" | head -1)
          echo "App: $APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          echo "Bundle: $BUNDLE_ID"
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          for state in idle recording-tap recording-release; do
            xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID" "assist-screenshot=$state"
            sleep 10
            xcrun simctl io "$UDID" screenshot "screenshots/$state.png"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
            sleep 2
          done
          ls -la screenshots

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: watch-assist-screenshots
          path: |
            screenshots
            build.log
