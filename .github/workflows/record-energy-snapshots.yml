name: Record Energy Snapshots

# Temporary helper: re-records the Energy widget medium/large snapshot references and prints them
# base64-encoded so they can be recovered from the job log. Delete once the references are committed.

on:
  push:
    branches:
      - feature/energy-widget-header-medium-large

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
  FASTLANE_SKIP_UPDATE_CHECK: true
  FASTLANE_XCODE_LIST_TIMEOUT: 80
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 80
  BUNDLE_PATH: vendor/bundle
  SNAPSHOT_DIR: Tests/Widgets/__Snapshots__/WidgetsSnapshot.test

jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: .ruby-version

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Restore: DerivedData"
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            ${{ format('{0}-deriveddata-{1}-{2}',
            runner.os,
            env.DEVELOPER_DIR,
            hashFiles('Package.resolved')) }}
          restore-keys: >-
            ${{ format('{0}-deriveddata-{1}-',
            runner.os,
            env.DEVELOPER_DIR) }}

      - name: Install Gems
        run: bundle install --jobs 4 --retry 3

      # Removing the outdated references makes snapshot-testing record fresh ones for exactly
      # these cases, leaving every other snapshot comparing as usual.
      - name: Drop outdated references
        run: |
          rm -f "$SNAPSHOT_DIR"/energyWidgetSystemMediumSnapshot.*.png
          rm -f "$SNAPSHOT_DIR"/energyWidgetSystemMediumSolarOnlySnapshot.*.png
          rm -f "$SNAPSHOT_DIR"/energyWidgetSystemMediumConsumptionOnlySnapshot.*.png
          rm -f "$SNAPSHOT_DIR"/energyWidgetSystemLargeSnapshot.*.png

      # Recording a missing reference is reported as a test failure, so the lane is expected to fail.
      - name: Run tests
        run: bundle exec fastlane test || true

      - name: Dump recorded references
        run: |
          for file in "$SNAPSHOT_DIR"/energyWidgetSystemMediumSnapshot.*.png \
                      "$SNAPSHOT_DIR"/energyWidgetSystemMediumSolarOnlySnapshot.*.png \
                      "$SNAPSHOT_DIR"/energyWidgetSystemMediumConsumptionOnlySnapshot.*.png \
                      "$SNAPSHOT_DIR"/energyWidgetSystemLargeSnapshot.*.png; do
            if [ -f "$file" ]; then
              echo "SNAPBEGIN $(basename "$file")"
              base64 < "$file" | tr -d '\n' | fold -w 100
              echo "SNAPEND $(basename "$file")"
            else
              echo "SNAPMISSING $file"
            fi
          done
