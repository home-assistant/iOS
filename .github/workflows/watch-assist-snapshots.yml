# Temporary: screenshots the Apple Watch Assist recording screen, as on `main` and as on this
# branch, on the smallest and the largest watch. Removed once the layout is settled.
name: Watch Assist snapshots

permissions:
  contents: read

on:
  push:
    branches:
      - watch-assist-audio-streaming
    paths:
      - .github/workflows/watch-assist-snapshots.yml
      - .github/watch-assist-snapshots/**
      - Sources/WatchApp/Assist/**
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

concurrency:
  group: watch-assist-snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshots:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Restore: DerivedData"
        id: derived_data
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            ${{ format('{0}-deriveddata-{1}-{2}',
            runner.os,
            env.DEVELOPER_DIR,
            hashFiles('Package.resolved')) }}
          restore-keys: >-
            ${{ format('{0}-deriveddata-{1}-',
            runner.os,
            env.DEVELOPER_DIR) }}

      - name: "Drop precompiled modules from a fallback DerivedData restore"
        if: steps.derived_data.outputs.cache-hit != 'true'
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project HomeAssistant.xcodeproj -scheme WatchApp

      - name: Open the app on the recording screen
        run: python3 .github/watch-assist-snapshots/prepare.py

      - name: "Capture: main"
        run: |
          git fetch --depth=1 origin main
          view=Sources/WatchApp/Assist/WatchAssistView.swift
          git show "FETCH_HEAD:$view" > "$view"
          .github/watch-assist-snapshots/capture.sh main

      - name: "Capture: branch"
        run: |
          git checkout HEAD -- Sources/WatchApp/Assist/WatchAssistView.swift
          .github/watch-assist-snapshots/capture.sh branch

      - name: Print snapshots
        if: always()
        run: .github/watch-assist-snapshots/print.sh
